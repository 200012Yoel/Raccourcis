name: Build Shortcut Bridge iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ShortcutBridge/Sources/**'
      - 'ShortcutBridge/project.yml'
      - '.github/workflows/build-shortcut-bridge.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Générer le projet iOS
        working-directory: ShortcutBridge
        run: xcodegen generate
      - name: Compiler iPhone sans signature
        working-directory: ShortcutBridge
        run: |
          set -o pipefail
          xcodebuild \
            -project ShortcutBridge.xcodeproj \
            -scheme ShortcutBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
      - name: Préparer un IPA de test NON SIGNÉ
        if: success()
        working-directory: ShortcutBridge
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/ShortcutBridge.app output/Payload/
          cd output
          zip -qry ShortcutBridge-NON-SIGNE.ipa Payload
          echo "IMPORTANT : ce .ipa ne s'installe pas directement sur iPhone."
      - name: Publier les binaires de test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShortcutBridge-iOS-build-non-signe
          path: ShortcutBridge/output/ShortcutBridge-NON-SIGNE.ipa
          retention-days: 14
      - name: Conserver les diagnostics de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShortcutBridge-logs
          path: ShortcutBridge/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier un résumé des erreurs dans le dépôt
        if: always()
        working-directory: ShortcutBridge
        run: |
          {
            echo "Build: ${{ github.run_id }}"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Result: ${{ job.status }}"
            echo "Dernières lignes du build:"
            if test -f xcodebuild.log; then
              grep -E "(error:|warning:|BUILD SUCCEEDED|BUILD FAILED)" xcodebuild.log | tail -80 || true
            else
              echo "Le compilateur n’a pas encore créé de journal. Échec possible XcodeGen."
            fi
          } > diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic.txt
          git commit -m "Diagnostic build Shortcut Bridge [skip ci]" || true
          git push origin HEAD:main || true
