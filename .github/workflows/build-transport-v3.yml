name: Build Transport V3 Siri natif

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_transport_v3.py"
      - ".github/workflows/build-transport-v3.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ShortcutKit
        run: python -m pip install "shortcutkit==0.8.1"
      - name: Générer le raccourci
        run: python build_transport_v3.py dist/Transport-V3.unsigned.shortcut
      - name: Tester l'absence de voix forcée et la structure
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path("dist/Transport-V3.unsigned.shortcut")
          o=plistlib.loads(p.read_bytes())
          a=o["WFWorkflowActions"]
          ids=[x["WFWorkflowActionIdentifier"] for x in a]
          assert len(a)>90, len(a)
          assert "is.workflow.actions.speaktext" not in ids
          assert ids.count("is.workflow.actions.ask")>=5
          assert ids.count("is.workflow.actions.choosefrommenu")>=1
          assert "is.workflow.actions.showresult" in ids
          assert "is.workflow.actions.text.match" in ids
          print("OK",len(a),"actions Siri")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Transport-V3-Siri-natif
          path: dist/Transport-V3.unsigned.shortcut
          retention-days: 20
      - name: Publier le fichier source du raccourci
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Transport-V3.unsigned.shortcut
          git diff --cached --quiet || git commit -m "Transport V3 [skip ci]"
          git push origin HEAD:main
      - name: Journal
        if: always()
        run: |
          echo "Run: ${{ github.run_id }}" > diagnostic-transport-v3.txt
          echo "Etat: ${{ job.status }}" >> diagnostic-transport-v3.txt
          ls -lh dist/Transport-V3.unsigned.shortcut >> diagnostic-transport-v3.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostic-transport-v3.txt
          git diff --cached --quiet || git commit -m "Diagnostic Transport V3 [skip ci]"
          git push origin HEAD:main || true
