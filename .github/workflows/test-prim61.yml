name: Test connexion PRIM 61

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_test_prim61.py"
      - ".github/workflows/test-prim61.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "shortcutkit==0.8.1"
      - name: Fabriquer le raccourci de diagnostic
        run: python build_test_prim61.py dist/Test-PRIM-61.unsigned.shortcut
      - name: Contrôler ses actions
        run: |
          python - <<'PY'
          from pathlib import Path
          import plistlib
          p=Path("dist/Test-PRIM-61.unsigned.shortcut")
          a=plistlib.loads(p.read_bytes())["WFWorkflowActions"]
          ids=[x["WFWorkflowActionIdentifier"] for x in a]
          assert ids.count("is.workflow.actions.downloadurl")==3, ids
          assert ids.count("is.workflow.actions.showresult")>=4
          assert "is.workflow.actions.speaktext" not in ids
          print("Fichier OK :",len(ids),"actions, 3 requêtes API PRIM")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Test-PRIM-61-non-signe
          path: dist/Test-PRIM-61.unsigned.shortcut
          retention-days: 21
      - name: Publier l'artefact dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Test-PRIM-61.unsigned.shortcut
          git diff --cached --quiet || git commit -m "Publier test PRIM 61 [skip ci]"
          git push origin HEAD:main
      - name: Publier les diagnostics
        if: always()
        run: |
          echo "Run: ${{ github.run_id }}" > diagnostic-test-prim61.txt
          echo "Status: ${{ job.status }}" >> diagnostic-test-prim61.txt
          ls -lh dist/Test-PRIM-61.unsigned.shortcut >> diagnostic-test-prim61.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostic-test-prim61.txt
          git diff --cached --quiet || git commit -m "Diagnostic test PRIM 61 [skip ci]"
          git push origin HEAD:main || true
