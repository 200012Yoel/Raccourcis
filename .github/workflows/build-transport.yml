name: Build Transport Shortcut

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_transport.py"
      - ".github/workflows/build-transport.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le générateur
        run: python -m pip install "shortcutkit==0.8.1"

      - name: Créer le fichier Shortcuts (non signé)
        run: python build_transport.py dist/Transport.unsigned.shortcut

      - name: Vérifier la structure du fichier
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("dist/Transport.unsigned.shortcut")
          data = plistlib.loads(path.read_bytes())
          actions = data.get("WFWorkflowActions", [])
          identifiers = [a["WFWorkflowActionIdentifier"] for a in actions]
          required = [
              "is.workflow.actions.getstoredcontent",
              "is.workflow.actions.setstoredcontent",
              "is.workflow.actions.downloadurl",
              "is.workflow.actions.getcurrentlocation",
              "is.workflow.actions.choosefrommenu",
              "is.workflow.actions.choosefromlist",
          ]
          for action in required:
              assert action in identifiers, action
          assert len(actions) >= 70, len(actions)
          assert "apikey" in str(data)
          assert "ma-cle-personnelle" not in str(data).lower()
          print("Structure valide :", len(actions), "actions.")
          PY

      - name: Télécharger le raccourci non signé
        uses: actions/upload-artifact@v4
        with:
          name: Transport-unsigned
          path: dist/Transport.unsigned.shortcut
          if-no-files-found: error
          retention-days: 14

      - name: Limitation de signature
        run: |
          echo "Ce raccourci est NON SIGNE."
          echo "Un Mac personnel connecté à iCloud est nécessaire pour exécuter :"
          echo 'shortcuts sign --mode anyone --input Transport.unsigned.shortcut --output Transport.shortcut'
