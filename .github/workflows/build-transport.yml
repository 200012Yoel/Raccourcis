name: Build Transport Shortcut

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_transport.py"
      - "sign_remote.py"
      - ".github/workflows/build-transport.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le générateur
        run: python -m pip install "shortcutkit==0.8.1"

      - name: Créer le fichier Shortcuts (non signé)
        run: python build_transport.py dist/Transport.unsigned.shortcut

      - name: Vérifier la structure du fichier
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("dist/Transport.unsigned.shortcut")
          data = plistlib.loads(path.read_bytes())
          actions = data.get("WFWorkflowActions", [])
          identifiers = [a["WFWorkflowActionIdentifier"] for a in actions]
          required = [
              "is.workflow.actions.getstoredcontent",
              "is.workflow.actions.setstoredcontent",
              "is.workflow.actions.downloadurl",
              "is.workflow.actions.getcurrentlocation",
              "is.workflow.actions.choosefrommenu",
              "is.workflow.actions.choosefromlist",
          ]
          for action in required:
              assert action in identifiers, action
          assert len(actions) >= 70, len(actions)
          assert "apikey" in str(data)
          assert "ma-cle-personnelle" not in str(data).lower()
          print("Structure valide :", len(actions), "actions.")
          PY

      - name: Signer à distance (Shortcuty puis HubSign)
        run: python sign_remote.py dist/Transport.unsigned.shortcut dist/Transport.shortcut

      - name: Vérifier le fichier signé
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("dist/Transport.shortcut")
          signed = path.read_bytes()
          assert signed.startswith(b"AEA1"), "La signature AEA1 est absente"
          assert len(signed) > 1024, "Le fichier semble incomplet"
          print(f"Fichier signé prêt : {path} ({len(signed)} octets)")
          PY

      - name: Conserver le fichier signé en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Transport-signe
          path: dist/Transport.shortcut
          if-no-files-found: error
          retention-days: 14

      - name: Publier le raccourci signé dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Transport.shortcut
          if git diff --cached --quiet; then
            echo "Même fichier, aucune publication nécessaire."
          else
            git commit -m "Publier Transport.shortcut signé [skip ci]"
            git push origin HEAD:main
          fi

      - name: Adresse du raccourci sur iPhone
        run: |
          echo "Fichier signé disponible après publication :"
          echo "https://raw.githubusercontent.com/200012Yoel/Raccourcis/main/dist/Transport.shortcut"
